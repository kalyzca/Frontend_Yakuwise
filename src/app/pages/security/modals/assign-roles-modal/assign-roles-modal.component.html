<p mat-dialog-title class="modal-title">
    Asignar Roles - {{ data.menuName | titlecase }}
    <button mat-icon-button class="close-button"  matTooltip="Cerrar" mat-dialog-close>
        <mat-icon>close</mat-icon>
    </button>
</p>
<mat-dialog-content>
    @if (isLoading()) {
        <div class="loading-container">
            <mat-spinner diameter="40"></mat-spinner>
            <p>Cargando roles disponibles...</p>
        </div>
    }
    @else {
        @if (availableRoles().length === 0) {
            <p class="no-roles-message">No hay roles disponibles para asignar.</p>
        }
        @else {
            <div>
                @for (role of availableRoles(); track role.id_rol) {
                    <div class="role-item">
                        <mat-slide-toggle [checked]="assignedRoles().has(role.id_rol!)" (change)="toggleRole(role.id_rol!)" class="role-toggle">
                            <span class="role-name">{{ role.nombre_rol }}</span>
                        </mat-slide-toggle>
                    </div>
                }
            </div>
        }
    }
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-button type="button" [disabled]="isSaving()" mat-dialog-close>Cancelar</button>
    <button mat-button type="button" (click)="onSave()" [disabled]="isSaving() || isLoading()">
        {{ isSaving() ? 'Guardando...': 'Guardar'}}
    </button>
</mat-dialog-actions>
