<p mat-dialog-title>
  Asignar Roles - {{ data.menuName }}
  <button mat-icon-button class="close-button" (click)="onCancel()" matTooltip="Cerrar">
    <mat-icon>close</mat-icon>
  </button>
</p>

<mat-dialog-content>
  @if (isLoading()) {
    <div class="loading-container">
      <mat-spinner diameter="40"></mat-spinner>
      <p>Cargando roles disponibles...</p>
    </div>
  }
  @else {
    @if (availableRoles().length === 0) {
      <p class="no-roles-message">No hay roles disponibles para asignar.</p>
    }
    @else {
      <div class="roles-list">
        @for (role of availableRoles(); track role.id_rol) {
          <div class="role-item">
            <mat-slide-toggle 
              [checked]="assignedRoles().has(role.id_rol!)"
              (change)="toggleRole(role.id_rol!)"
              class="role-toggle"
            >
              <span class="role-name">{{ role.nombre_rol }}</span>
            </mat-slide-toggle>
          </div>
        }
      </div>
    }
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="onCancel()" [disabled]="isSaving()">
    Cancelar
  </button>
  <button mat-button color="primary" type="button" (click)="onSave()" [disabled]="isSaving() || isLoading()">
    @if (isSaving()) {
      <mat-spinner diameter="20" class="button-spinner"></mat-spinner>
      Guardando...
    }
    @else {
      Guardar
    }
  </button>
</mat-dialog-actions>
