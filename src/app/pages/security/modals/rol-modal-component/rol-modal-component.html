<p mat-dialog-title>{{ isEditMode() ? 'Editar Rol' : 'Agregar Rol' }}</p>

<mat-dialog-content>
    <!-- Campo Rol -->
     <div class="form-input-container">
        <label for="nameRol" class="label-input-container">Nombre: (*)</label>
        <mat-form-field appearance="outline" class="custom-input">
            <input matInput id="nameRol" [ngModel]="name()" (ngModelChange)="name.set($event)" (blur)="nameTouched.set(true)" placeholder="Ej. Administrador" required>
            
            <!-- Renderizado condicional del error basado en la señal computada -->
            @if (nameError()) {
                <mat-error class="error-with-icon">
                    <img [src]="errorIconPath()" class="error-icon" alt="Error" width="16" height="16" >
                    {{ nameError() }}
                </mat-error>
            }
        </mat-form-field>
    </div>

    <!-- Campo estado -->
    <div class="form-input-container">
        <label for="state" class="label-input-container custom-switch">Estado:</label>
        <mat-slide-toggle id="state" [checked]="isActive()" (change)="isActive.set($event.checked)">
            <p class="txt-switch">
                El rol está 
                <span  class="state-text">&nbsp;{{statusText().toLowerCase()}}.</span>
            </p>
        </mat-slide-toggle>
    </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button (click)="onCancel()">Cancelar</button>
    <button mat-button color="primary" type="submit" [disabled]="isFormInvalid()" (click)="onSave()">{{ isEditMode() ? 'Actualizar' : 'Guardar' }}</button>
</mat-dialog-actions>
