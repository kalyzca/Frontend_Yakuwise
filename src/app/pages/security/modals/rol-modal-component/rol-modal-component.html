<h3 mat-dialog-title>{{ isEditMode() ? 'Editar Rol' : 'Agregar Rol' }}</h3>

<mat-dialog-content>
    <!-- Campo Rol -->
    <label for="nameRol" style="display: block; margin-bottom: 5px; font-weight: bold;">Nombre</label>
    <mat-form-field appearance="fill" class="full-width">
        <input matInput id="nameRol" [ngModel]="name()" (ngModelChange)="name.set($event)" (blur)="nameTouched.set(true)" placeholder="Ej. Administrador" required>
        
        <!-- Renderizado condicional del error basado en la señal computada -->
        @if (nameError()) {
            <mat-error>{{ nameError() }}</mat-error>
        }
    </mat-form-field>

    <!-- Campo estado -->
    <div style="margin-top: 15px;">
        <label for="state" style="display: block; margin-bottom: 8px; font-weight: bold;">Estado:</label>
        <mat-slide-toggle id="state" [checked]="isActive()" (change)="isActive.set($event.checked)">
            El rol está 
            <p class="state-text">{{ statusText().toLowerCase() }}.</p>
        </mat-slide-toggle>
    </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button  (click)="onCancel()">Cancelar</button>
    <button mat-button color="primary" type="submit" [disabled]="isFormInvalid()" (click)="onSave()">{{ isEditMode() ? 'Actualizar' : 'Guardar' }}</button>
</mat-dialog-actions>
