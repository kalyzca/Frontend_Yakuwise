<p mat-dialog-title>Restablecer Contraseña</p>
<mat-dialog-content>
    <svg class="error-icon-large" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 1 1-18 0a9 9 0 0 1 18 0" />
    </svg>
    <p class="parrafo">¿Desea restablecer la contraseña de {{ dataUser?.name }}?</p>
</mat-dialog-content>
<mat-dialog-actions align="center">
    <button matButton mat-dialog-close>No, Cancelar</button>
    <button matButton (click)="resetPassword()" [disabled]="isLoading()">
        {{ isLoading() ? "Cargando..." : "Sí, Restablecer" }}
    </button>
</mat-dialog-actions>
